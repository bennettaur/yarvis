<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- xterm's DOM renderer adds <style> elements, so inline styles stay allowed. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src data:; font-src 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <link rel="stylesheet" href="xterm.css">
  <style>
    html, body { margin: 0; height: 100%; background: #1e1e1e; overflow: hidden; }
    #terminal { position: absolute; inset: 0 2px; }
  </style>
</head>
<body>
  <div id="terminal"></div>
  <script src="xterm.js"></script>
  <script src="addon-fit.js"></script>
  <script src="terminal.js"></script>
</body>
</html>
