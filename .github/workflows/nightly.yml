name: Nightly Build

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

jobs:
  create-release:
    name: Create/Update Nightly Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create or update nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --yes --cleanup-tag || true
          echo "Nightly build from $(date +'%Y-%m-%d %H:%M:%S')" > release-notes.md
          cat >> release-notes.md <<'NOTES'

          ### Installing on macOS

          Nightly builds are ad-hoc code-signed but not notarized by Apple, so
          Gatekeeper blocks the first launch. Drag **Yarvis** into
          `/Applications`, try to open it once, then allow it from **System
          Settings → Privacy & Security → Open Anyway**.

          See "Installing a nightly build" in the README for the details.
          NOTES
          gh release create nightly --prerelease --title "Nightly Release" --notes-file release-notes.md

  build:
    name: Build (${{ matrix.platform }})
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.platform }}

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Build app
        env:
          # macOS refuses to launch a quarantined bundle that carries no code
          # signature at all, reporting it as damaged. Tauri only signs when it
          # is handed an identity, so fall back to ad-hoc signing ("-") when no
          # Developer ID certificate is configured. Ad-hoc leaves the app
          # unnotarized — see "Installing a nightly build" in README.md for what
          # that costs the user. Kept off the other runners so a compromised
          # dependency there can never read the certificate.
          APPLE_CERTIFICATE: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.platform == 'macos-latest' && (secrets.APPLE_SIGNING_IDENTITY || '-') || '' }}
          # Notarization is skipped with a warning unless all three are set.
          APPLE_ID: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_TEAM_ID || '' }}
        run: bun run tauri build

      - name: Verify macOS code signature
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          EXPECT_DEVELOPER_ID: ${{ secrets.APPLE_SIGNING_IDENTITY != '' }}
        run: |
          bundle_dir=src-tauri/target/release/bundle/macos
          app_bundle="$(find "$bundle_dir" -maxdepth 1 -name '*.app' | head -n 1)"
          if [ -z "$app_bundle" ]; then
            echo "No .app bundle found in $bundle_dir" >&2
            exit 1
          fi
          codesign --verify --strict --verbose=2 "$app_bundle"
          # An intact seal says nothing about who signed it, so a certificate
          # that expired or failed to import would quietly degrade to the ad-hoc
          # fallback and still pass the check above. spctl runs the Gatekeeper
          # policy itself, which an ad-hoc signature cannot satisfy.
          if [ "$EXPECT_DEVELOPER_ID" = "true" ]; then
            spctl --assess --type execute --verbose=4 "$app_bundle"
          fi

      - name: Upload artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          find src-tauri/target/release/bundle -type f \( -name "*.dmg" -o -name "*.msi" -o -name "*.exe" -o -name "*.deb" -o -name "*.AppImage" -o -name "*.tar.gz" \) | while read -r file; do
            echo "Uploading $file..."
            gh release upload nightly "$file" --clobber
          done
