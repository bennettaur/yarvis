name: Nightly Build

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

jobs:
  create-release:
    name: Create/Update Nightly Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create or update nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --yes --cleanup-tag || true
          cat > release-notes.md <<NOTES
          Nightly build from $(date +'%Y-%m-%d %H:%M:%S')

          ### Installing on macOS

          Nightly builds are not notarized by Apple, so macOS quarantines the
          \`.dmg\` on download and refuses to launch what it contains. After
          dragging **Yarvis** into \`/Applications\`, clear the quarantine flag:

          \`\`\`bash
          xattr -dr com.apple.quarantine /Applications/Yarvis.app
          \`\`\`

          Skipping this step is what produces the "Yarvis is damaged and can't be
          opened" error.
          NOTES
          gh release create nightly --prerelease --title "Nightly Release" --notes-file release-notes.md

  build:
    name: Build (${{ matrix.platform }})
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.platform }}

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Build app
        env:
          # macOS refuses to launch a quarantined bundle that carries no code
          # signature at all, reporting it as damaged. Tauri only signs when it
          # is given an identity, so fall back to ad-hoc signing ("-") when no
          # Developer ID certificate is configured. Ad-hoc still leaves the app
          # unnotarized — see the release notes for the quarantine workaround.
          # Non-macOS runners ignore these.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || '-' }}
          # Notarization is skipped with a warning unless all three are set.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bun run tauri build

      - name: Verify macOS code signature
        if: matrix.platform == 'macos-latest'
        run: |
          app="$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' | head -n 1)"
          if [ -z "$app" ]; then
            echo "No .app bundle found to verify" >&2
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$app"

      - name: Upload artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          find src-tauri/target/release/bundle -type f \( -name "*.dmg" -o -name "*.msi" -o -name "*.exe" -o -name "*.deb" -o -name "*.AppImage" -o -name "*.tar.gz" \) | while read -r file; do
            echo "Uploading $file..."
            gh release upload nightly "$file" --clobber
          done
