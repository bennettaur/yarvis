name: Nightly Build

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

jobs:
  create-release:
    name: Create/Update Nightly Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create or update nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --yes --cleanup-tag || true
          echo "Nightly build from $(date +'%Y-%m-%d %H:%M:%S')" > release-notes.md
          cat >> release-notes.md <<'NOTES'

          ### Installing on macOS

          Nightly builds are ad-hoc code-signed but not notarized by Apple, so
          Gatekeeper blocks the first launch. Drag **Yarvis** into
          `/Applications`, try to open it once, then allow it from **System
          Settings → Privacy & Security → Open Anyway**.

          See "Nightly builds" in docs/development.md for the details.

          ### Native clients

          `Yarvis-native-macos.zip` is the native macOS client (apps/macos),
          signed the same ad-hoc way. `yarvis-android-debug.apk` is a debug
          build of the Android client (apps/android), for testing only: it is
          debuggable, so anything with adb access to the phone can read its
          stored device token. Each nightly is signed with a different debug
          key, so uninstall the previous one before
          `adb install yarvis-android-debug.apk`.
          NOTES
          gh release create nightly --prerelease --title "Nightly Release" --notes-file release-notes.md

  build:
    name: Build (${{ matrix.platform }})
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # `tauri:build` also builds server/ (`bun run server:compile`), which is
      # its own Cargo workspace with its own target dir.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            server
          key: ${{ matrix.platform }}

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Configure macOS signing
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # macOS refuses to launch a quarantined bundle that carries no code
          # signature at all, reporting it as damaged, and Tauri only signs when
          # it is handed an identity. Ad-hoc ("-") is the floor when no Developer
          # ID certificate is configured; it leaves the app unnotarized, so see
          # "Nightly builds" in docs/development.md for what that costs users.
          echo "APPLE_SIGNING_IDENTITY=${APPLE_SIGNING_IDENTITY:--}" >> "$GITHUB_ENV"

          # Tauri reads the rest with var_os, which cannot distinguish "set to
          # empty" from "has a value": an empty APPLE_CERTIFICATE sends it down
          # the import-a-certificate path, and empty Apple ID credentials make it
          # attempt notarization rather than skip it — both fail the build. A
          # workflow cannot omit an `env:` key conditionally, so forward only the
          # variables that actually hold something. Confining this to a macOS-only
          # step also keeps the certificate off the Linux and Windows runners.
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            value="${!name}"
            [ -n "$value" ] || continue
            {
              echo "$name<<__APPLE_ENV__"
              echo "$value"
              echo "__APPLE_ENV__"
            } >> "$GITHUB_ENV"
          done

      - name: Build app
        run: bun run tauri:build

      - name: Verify macOS code signature
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          EXPECT_DEVELOPER_ID: ${{ secrets.APPLE_SIGNING_IDENTITY != '' || secrets.APPLE_CERTIFICATE != '' }}
        run: |
          bundle_dir=src-tauri/target/release/bundle/macos
          app_bundle="$(find "$bundle_dir" -maxdepth 1 -name '*.app' | head -n 1)"
          if [ -z "$app_bundle" ]; then
            echo "No .app bundle found in $bundle_dir" >&2
            exit 1
          fi
          codesign --verify --strict --verbose=2 "$app_bundle"
          # An intact seal says nothing about who signed it, so a certificate
          # that expired or failed to import would quietly degrade to the ad-hoc
          # fallback and still pass the check above. spctl runs the Gatekeeper
          # policy itself, which an ad-hoc signature cannot satisfy.
          if [ "$EXPECT_DEVELOPER_ID" = "true" ]; then
            spctl --assess --type execute --verbose=4 "$app_bundle"
          fi

      - name: Upload artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          find src-tauri/target/release/bundle -type f \( -name "*.dmg" -o -name "*.msi" -o -name "*.exe" -o -name "*.deb" -o -name "*.AppImage" -o -name "*.tar.gz" \) | while read -r file; do
            echo "Uploading $file..."
            gh release upload nightly "$file" --clobber
          done

  # CI builds the native apps only on pull requests that change them, so this
  # is where every night's main gets built and tested for both. The builds
  # run SwiftPM and Gradle dependencies, so they get a read-only token and
  # hand their output to publish-native-apps, which runs no build code.
  macos-app:
    name: Native macOS app
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # SwiftTerm's manifest needs Swift 6.2, which the runner's default Xcode
      # may predate, so the newest installed Xcode is picked.
      - name: Select the newest Xcode
        run: |
          xcode="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "$xcode"
          swift --version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      # make-app.sh copies Mermaid out of the root node_modules, and needs no
      # package's install scripts for it.
      - name: Install JS dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: swift test
        working-directory: apps/macos
        run: swift test
      - name: Build Yarvis.app
        working-directory: apps/macos
        run: scripts/make-app.sh
      # ditto keeps the bundle's code signature intact, which zip does not.
      - name: Zip Yarvis.app
        working-directory: apps/macos
        run: ditto -c -k --keepParent build/Yarvis.app Yarvis-native-macos.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-macos
          path: apps/macos/Yarvis-native-macos.zip
          retention-days: 1

  android:
    name: Android app
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: "21"
      # Also checks gradle-wrapper.jar against Gradle's published checksums.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - name: Test, build and lint
        working-directory: apps/android
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug lint
      # A debug build, since there's no release signing key.
      - name: Name the APK
        run: cp apps/android/app/build/outputs/apk/debug/app-debug.apk yarvis-android-debug.apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-android
          path: yarvis-android-debug.apk
          retention-days: 1

  publish-native-apps:
    name: Publish native apps
    needs: [create-release, macos-app, android]
    # One app failing to build shouldn't keep the other off the release.
    if: ${{ !cancelled() && needs.create-release.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Attach to the nightly release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for name in native-macos native-android; do
            gh run download "$GITHUB_RUN_ID" -n "$name" -D out || echo "No $name artifact; its build failed."
          done
          mkdir -p out
          find out -type f | while read -r file; do
            gh release upload nightly "$file" --clobber
          done
