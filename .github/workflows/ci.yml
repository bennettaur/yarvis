name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Nothing here writes back to GitHub. Setting the default in the workflow keeps
# it that way even if the repository's default token permissions are widened,
# which would otherwise hand write scopes to jobs that install and run
# dependencies resolved from a pull request's own lockfiles. A job that needs
# more has to say so in its own permissions: block, where review can see it.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

jobs:
  # Which app folders a pull request touches, so each app job runs only when
  # its own folder (or this workflow) changed. Pushes to main and manual runs
  # build every app, and the nightly workflow builds them all either way.
  changes:
    name: Changed apps
    runs-on: ubuntu-latest
    outputs:
      macos: ${{ steps.diff.outputs.macos }}
      android: ${{ steps.diff.outputs.android }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # A pull request checks out its merge commit, whose first parent is
          # the base branch, so HEAD^1 is all the diff needs.
          fetch-depth: 2
          persist-credentials: false
      - id: diff
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "macos=true" >> "$GITHUB_OUTPUT"
            echo "android=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only HEAD^1 HEAD)"
          touched() { printf '%s\n' "$changed" | grep -qE "$1" && echo true || echo false; }
          echo "macos=$(touched '^(apps/macos/|\.github/workflows/ci\.yml$)')" >> "$GITHUB_OUTPUT"
          echo "android=$(touched '^(apps/android/|\.github/workflows/ci\.yml$)')" >> "$GITHUB_OUTPUT"

  bun-lint-and-format:
    name: Lint & format (Biome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Biome check (lint + format)
        run: bun run check

  bun-typecheck:
    name: TypeScript typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Frontend typecheck
        run: bun run typecheck
      - name: Sidecar typecheck
        run: bun run sidecar:typecheck

  video-typecheck:
    name: Showcase video typecheck
    runs-on: ubuntu-latest
    # The video's scenes import app components from src/, so a change to their
    # props can break it from any pull request, not only ones touching video/.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          bun install --frozen-lockfile --cwd video
      - name: Typecheck
        run: bun run --cwd video typecheck

  bun-frontend-test:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Pull requests run only the affected tests, diffed against HEAD^1
          # (see the changes job).
          fetch-depth: 2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run frontend tests
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            bun run scripts/affected-tests.ts frontend --base HEAD^1
          else
            bun run test
          fi

  turn-server-test:
    name: Turn detector tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Run turn detector tests
        run: uv run --quiet --script sidecar/src/voice/turn_server_test.py

  bun-test:
    name: Sidecar tests
    runs-on: ubuntu-latest
    # The sidecar suite exercises Drizzle/pgvector against a real database, so
    # CI provisions a throwaway Postgres with the vector extension available.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: yarvis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # migrate.ts reads DATABASE_URL; the tests read TEST_DATABASE_URL. Both
      # point at the same service container.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/yarvis_test
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/yarvis_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Pull requests run only the affected tests, diffed against HEAD^1
          # (see the changes job).
          fetch-depth: 2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Apply database migrations
        run: bun run --cwd sidecar db:migrate
      - name: Run sidecar tests
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            bun run scripts/affected-tests.ts sidecar --base HEAD^1
          else
            bun run sidecar:test
          fi

  bun-audit:
    name: bun audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # The first five ignored advisories are DOMPurify 3.4.15's. monaco-editor
      # bundles its own copy and imports that, so no override can replace it.
      # Its sanitizer doesn't use the modes they need (SAFE_FOR_TEMPLATES,
      # IN_PLACE, an xhtml PARSER_MEDIA_TYPE). Drop them when a monaco-editor
      # release bundles 3.4.17+.
      #
      # GHSA-fc5q-39xc-vjpf is a picomatch ReDoS with no patched release yet.
      # Only build tooling reaches it (vite, and chokidar under the sass that
      # Excalidraw lists but doesn't bundle), matching our own globs. Drop it
      # once fixed 4.x and 2.x releases ship and an override can pin both.
      - name: Audit production dependencies
        run: >-
          bun audit --prod
          --ignore=GHSA-cg2g-xh64-v4q7
          --ignore=GHSA-mrv2-3pqr-j5jr
          --ignore=GHSA-p98j-92pf-mc4p
          --ignore=GHSA-6688-9rhm-gjv2
          --ignore=GHSA-c6gr-qvv4-5v3f
          --ignore=GHSA-fc5q-39xc-vjpf

  rust-fmt:
    name: Rust formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt
      - name: cargo fmt --check
        working-directory: src-tauri
        run: cargo fmt --all -- --check

  rust-clippy:
    name: Rust clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --no-deps -- -D warnings

  rust-test:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
      - name: cargo test
        working-directory: src-tauri
        run: cargo test --all-targets

  cargo-audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Nothing here pushes, and the install below compiles third-party
          # build scripts that would otherwise be able to read the token
          # checkout leaves in .git/config.
          persist-credentials: false
      # Deliberately uncached. rust-cache would cache ~/.cargo/bin, which makes
      # the install a no-op and runs whichever cargo-audit the cache holds — a
      # tampered one exits 0 and silently removes the gate. This job never
      # compiles the workspace, so the cache would only have saved the install.
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2
      # The advisories we accept live in src-tauri/.cargo/audit.toml, which
      # cargo audit picks up from its working directory — so a local run in
      # src-tauri/ gates on exactly what CI gates on.
      - name: cargo audit
        working-directory: src-tauri
        run: cargo audit
      # The server's accepted advisories live in server/.cargo/audit.toml, the
      # same way.
      - name: cargo audit (server)
        working-directory: server
        run: cargo audit

  # The server is its own Cargo workspace with no Tauri, so it needs none of
  # the webkit packages the src-tauri jobs install.
  server-rust:
    name: Server (fmt, clippy, test)
    runs-on: ubuntu-latest
    # The server keeps its state in Postgres; each test gets its own schema.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: yarvis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/yarvis_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: server
      - name: cargo fmt --check
        working-directory: server
        run: cargo fmt --all -- --check
      - name: cargo clippy
        working-directory: server
        run: cargo clippy --all-targets --no-deps -- -D warnings
      - name: cargo test
        working-directory: server
        run: cargo test --all-targets

  macos-app:
    name: macOS app (swift build, swift test)
    needs: changes
    if: needs.changes.outputs.macos == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # SwiftTerm's manifest needs Swift 6.2, which the runner's default Xcode
      # may predate, so the newest installed Xcode is picked.
      - name: Select the newest Xcode
        run: |
          xcode="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "$xcode"
          swift --version
      - name: swift build
        working-directory: apps/macos
        run: swift build
      - name: swift test
        working-directory: apps/macos
        run: swift test

  android:
    name: Android app (unit tests, build, lint)
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: "21"
      # Also checks gradle-wrapper.jar against Gradle's published checksums.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - name: Test, build and lint
        working-directory: apps/android
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug lint


  e2e:
    name: End to end (server + web UI in Chromium)
    runs-on: ubuntu-latest
    # The server under test keeps its state in a schema of this Postgres.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: yarvis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/yarvis_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      # Playwright and Vite run under Node, and Vite 8 needs 20.19 or later.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: server
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Build the web UI
        run: bun run build
      - name: Build yarvis-server
        run: cargo build --manifest-path server/Cargo.toml -p yarvis-server
      - name: Run the end-to-end tests
        run: bun run e2e
      - name: Keep traces of failed tests
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: e2e-failures
          path: e2e/output
          retention-days: 7
