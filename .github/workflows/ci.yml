name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Nothing here writes back to GitHub. Setting the default in the workflow keeps
# it that way even if the repository's default token permissions are widened,
# which would otherwise hand write scopes to jobs that install and run
# dependencies resolved from a pull request's own lockfiles. A job that needs
# more has to say so in its own permissions: block, where review can see it.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

jobs:
  bun-lint-and-format:
    name: Lint & format (Biome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Biome check (lint + format)
        run: bun run check

  bun-typecheck:
    name: TypeScript typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Frontend typecheck
        run: bun run typecheck
      - name: Sidecar typecheck
        run: bun run sidecar:typecheck

  bun-frontend-test:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run frontend tests
        run: bun run test

  bun-test:
    name: Sidecar tests
    runs-on: ubuntu-latest
    # The sidecar suite exercises Drizzle/pgvector against a real database, so
    # CI provisions a throwaway Postgres with the vector extension available.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: yarvis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # migrate.ts reads DATABASE_URL; the tests read TEST_DATABASE_URL. Both
      # point at the same service container.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/yarvis_test
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/yarvis_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Apply database migrations
        run: bun run --cwd sidecar db:migrate
      - name: Run sidecar tests
        run: bun run sidecar:test

  bun-audit:
    name: bun audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # GHSA-67mh-4wv8-2f99 (esbuild dev-server CORS) reaches us only through
      # drizzle-kit's archived @esbuild-kit loader, which has no patched
      # release. It is a build-time tool that never runs an esbuild dev server,
      # so the advisory is not exploitable here. Any other moderate+ advisory
      # still fails this job.
      - name: Audit production dependencies
        run: bun audit --prod --ignore GHSA-67mh-4wv8-2f99

  rust-fmt:
    name: Rust formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt
      - name: cargo fmt --check
        working-directory: src-tauri
        run: cargo fmt --all -- --check

  rust-clippy:
    name: Rust clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --no-deps -- -D warnings

  rust-test:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
      - name: cargo test
        working-directory: src-tauri
        run: cargo test --all-targets

  cargo-audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Nothing here pushes, and the install below compiles third-party
          # build scripts that would otherwise be able to read the token
          # checkout leaves in .git/config.
          persist-credentials: false
      # Deliberately uncached. rust-cache would cache ~/.cargo/bin, which makes
      # the install a no-op and runs whichever cargo-audit the cache holds — a
      # tampered one exits 0 and silently removes the gate. This job never
      # compiles the workspace, so the cache would only have saved the install.
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2
      # The advisories we accept live in src-tauri/.cargo/audit.toml, which
      # cargo audit picks up from its working directory — so a local run in
      # src-tauri/ gates on exactly what CI gates on.
      - name: cargo audit
        working-directory: src-tauri
        run: cargo audit

