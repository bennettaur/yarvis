name: Verify revert

# When CI fails on a push to main, backs out the PR behind it if the gate
# auto-merged it. See scripts/verify/revert.ts for when it reverts, re-runs or
# leaves it alone. workflow_run runs this file as it is on the default branch,
# and the job checks out only the default branch.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# One decision per commit, so a re-run's result can't race the first one's.
concurrency:
  group: verify-revert-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  revert:
    name: Revert a breaking auto-merge
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # Created after the install, so no package install script sees it.
      - name: Get a yarvis bot token
        id: bot
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.YARVIS_BOT_CLIENT_ID }}
          private-key: ${{ secrets.YARVIS_BOT_PRIVATE_KEY }}
          permission-actions: write
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - name: Revert, re-run or leave it
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          GH_REPO: ${{ github.repository }}
          BOT_SLUG: ${{ steps.bot.outputs.app-slug }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: bun run scripts/verify/revert.ts
