name: Verify

# Reacts to two kinds of PR comment: a verification report posted by the
# `/verify-pr` skill, and `/approve` from a maintainer. See
# scripts/verify/gate.ts for what each one does.
#
# issue_comment runs this file and the gate script as they are on the default
# branch, never a PR's copy, and with secrets. So the job checks out the
# default branch only and never runs code from the PR.
on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  gate:
    name: Verification gate
    # The markers are REPORT_MARKER in scripts/verify/report.ts and
    # AGENT_REVIEW_MARKER in scripts/verify/agentReview.ts. Comments from
    # anyone without write access skip the job, so they never join a
    # concurrency group to delay or displace a real run. The gate still checks
    # the trusted list.
    if: >-
      github.event.issue.pull_request &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
      (startsWith(github.event.comment.body, '/approve') ||
       contains(github.event.comment.body, '<!-- yarvis-verify -->') ||
       contains(github.event.comment.body, '<!-- yarvis-agent-review -->'))
    runs-on: ubuntu-latest
    # On the job, not the workflow, so only comments that pass the `if` above
    # join a group. One run per PR and comment kind at a time: GitHub keeps
    # only the newest pending run in a group, so sharing one would let one
    # kind drop another.
    concurrency:
      group: verify-${{ github.event.issue.number }}-${{ startsWith(github.event.comment.body, '/approve') && 'approve' || contains(github.event.comment.body, '<!-- yarvis-agent-review -->') && 'agent-review' || 'report' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # Created after the install, so no package install script sees it.
      - name: Get a yarvis bot token
        id: bot
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.YARVIS_BOT_CLIENT_ID }}
          private-key: ${{ secrets.YARVIS_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-statuses: write
      - name: Run the gate
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          GH_REPO: ${{ github.repository }}
          VERIFY_MODE: ${{ vars.VERIFY_MODE || 'shadow' }}
          # 2670128 is bennettaur.
          VERIFY_TRUSTED_USER_IDS: ${{ vars.VERIFY_TRUSTED_USER_IDS || '2670128' }}
          # Public keys only. With none set, the gate accepts no report.
          VERIFY_ALLOWED_SIGNERS: ${{ vars.VERIFY_ALLOWED_SIGNERS }}
        run: bun run scripts/verify/gate.ts
