name: Verify

# Reacts to two kinds of PR comment: a verification report posted by the
# `/verify-pr` skill, and `/approve` from a maintainer. See
# scripts/verify/gate.ts for what each one does.
#
# issue_comment runs this file and the gate script as they are on the default
# branch, never a PR's copy, and with secrets. So the job checks out the
# default branch only and never runs code from the PR.
on:
  issue_comment:
    types: [created]

permissions:
  contents: read

# One run per PR at a time, so an /approve and a report can't race each other.
concurrency:
  group: verify-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  gate:
    name: Verification gate
    if: >-
      github.event.issue.pull_request &&
      (startsWith(github.event.comment.body, '/approve') ||
       contains(github.event.comment.body, '<!-- yarvis-verify -->'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # Created after the install, so no package install script sees it.
      - name: Get a yarvis bot token
        id: bot
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.YARVIS_BOT_CLIENT_ID }}
          private-key: ${{ secrets.YARVIS_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-statuses: write
      - name: Run the gate
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          GH_REPO: ${{ github.repository }}
          VERIFY_MODE: ${{ vars.VERIFY_MODE || 'shadow' }}
          VERIFY_TRUSTED_USERS: ${{ vars.VERIFY_TRUSTED_USERS || 'bennettaur' }}
        run: bun run scripts/verify/gate.ts
