# Only resolve to crate versions published at least 7 days ago, so a malicious
# or broken release can be caught and yanked first. Versions already in
# Cargo.lock are kept. Needs Cargo 1.100+; older Cargo ignores it. To take a
# newer fix early:
#   CARGO_RESOLVER_INCOMPATIBLE_PUBLISH_AGE=allow cargo update -p <crate> --precise <version>
[registry]
global-min-publish-age = "7 days"
