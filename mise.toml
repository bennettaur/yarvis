[tools]
bun = "latest"
rust = "latest"

# Safe to re-run: each step skips what is already there. `mise run` installs
# Bun and Rust first.
[tasks.yarvis-init]
description = "Install Postgres 17 with pgvector, create the yarvis database, and install dependencies"
run = """
# Without this, brew upgrades an outdated install, and the cleanup after it
# deletes the binaries a running server was started from.
HOMEBREW_NO_INSTALL_UPGRADE=1 brew install postgresql@17 pgvector
pg="$(brew --prefix postgresql@17)/bin"

# Any Postgres already on localhost:5432 is used as is, so a 16 or 18 install
# isn't fought over the port.
if ! "$pg/pg_isready" -q -h localhost; then
  brew services start postgresql@17
  for _ in $(seq 1 30); do
    "$pg/pg_isready" -q -h localhost && break
    sleep 1
  done
fi

if ! "$pg/psql" -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname = 'yarvis'" | grep -q 1; then
  "$pg/createdb" yarvis
fi
"$pg/psql" -d yarvis -c 'CREATE EXTENSION IF NOT EXISTS vector;'

bun install

echo
echo "Done. Start the app with: mise exec -- bun run tauri dev"
echo "Then save postgres://localhost:5432/yarvis and an LLM provider key in Settings -> Credentials."
"""
