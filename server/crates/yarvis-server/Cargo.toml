[package]
name = "yarvis-server"
version = "0.1.0"
description = "The Yarvis server: auth, devices, events, PTYs, secrets, and a proxy to the Bun sidecar"
edition.workspace = true
rust-version.workspace = true

[dependencies]
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
chacha20poly1305 = "0.10"
hkdf = "0.12"
rand = "0.9"
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
signature = "2"
ssh-agent-lib = "0.6"
ssh-key = { version = "0.6", features = ["ed25519"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "fs", "process", "io-util"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
webauthn-rs = "0.6.2"
zeroize = { version = "1", features = ["zeroize_derive", "serde"] }

[dev-dependencies]
futures-util = "0.3"
http-body-util = "0.1"
tempfile = "3"
tokio-tungstenite = "0.28"
tower = { version = "0.5", features = ["util"] }
webauthn-authenticator-rs = { version = "0.6.2", features = ["softpasskey"] }
