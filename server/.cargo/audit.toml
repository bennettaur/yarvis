[advisories]
# RUSTSEC-2023-0071 is the Marvin timing side channel in `rsa`, which can leak
# an RSA private key through the timing of decryption or signing. ssh-key 0.6
# (through ssh-agent-lib, for the ssh-agent) reaches rsa 0.9, which has no
# fixed release. The server holds no RSA private key: the agent signs only with
# its Ed25519 key, and RSA code only ever parses public keys in agent
# requests. Drop this once ssh-agent-lib moves to ssh-key 0.7.
#
# This suppresses noise only: with no `deny` set, cargo audit fails on
# vulnerabilities and merely warns on informational advisories.
#
# RUSTSEC-2026-0387 is timing variability in `crypto-bigint` 0.5, which can
# leak secret values through the timing of its arithmetic. ssh-agent-lib 0.6.0
# (the latest release) turns on ssh-key 0.6's `crypto` feature, which pulls in
# the P-256/384/521 curves and with them crypto-bigint 0.5.5. The server's only
# private key is the ssh-agent's Ed25519 key, which uses curve25519-dalek, not
# crypto-bigint. The P-curve code only ever parses public key data from an
# incoming agent request. Drop this once ssh-agent-lib moves to ssh-key 0.7.
ignore = ["RUSTSEC-2023-0071", "RUSTSEC-2026-0387"]
